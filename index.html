<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
    <meta name="description" content="MovePilot calculates your exact cubic volume, shipping weight, and cost from your own inventory — and verifies any carrier against federal FMCSA safety records. No phone. No email. No lead brokers." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>MovePilot — Real math. No spam.</title>
    <script>
      // Apply persisted / OS theme BEFORE first paint to avoid a flash.
      // The header toggle overrides OS preference and persists to localStorage.
      (function () {
        try {
          var stored = localStorage.getItem('mp-theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
